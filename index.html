<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Even Frames</title>
<style>
:root{--fg:#fff;--fg2:rgba(255,255,255,.72);--fg3:rgba(255,255,255,.5);--accent:#0a84ff;--warn:#ffd60a;--blur:24px;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Roboto,"Segoe UI",system-ui,sans-serif}
:root.lite{--blur:10px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;color:var(--fg);font:15px/1.4 var(--font);-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
body{background:radial-gradient(120% 80% at 15% 0%,#1c2a46 0%,transparent 60%),radial-gradient(100% 70% at 100% 100%,#3b2236 0%,transparent 60%),#000}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none}
.glass{background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%);
 box-shadow:inset 0 .5px 0 rgba(255,255,255,.55),inset 0 0 0 .5px rgba(255,255,255,.2),0 10px 30px rgba(0,0,0,.3)}
.glass.pri{background:rgba(10,132,255,.85);font-weight:600}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(40,40,44,.94)}}
@media (prefers-reduced-transparency:reduce){.glass{background:rgba(40,40,44,.97);backdrop-filter:none;-webkit-backdrop-filter:none}}
.circ{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.circ.sm{width:40px;height:40px}
.circ[aria-pressed=true]{background:rgba(255,255,255,.9);color:#000}
.pill{height:40px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.warn{color:var(--warn)}
.pill.wide{width:100%;height:50px;font-size:16px}
/* empty */
#empty{position:fixed;inset:0;display:grid;place-items:center;padding:24px}
.hero{max-width:380px;border-radius:32px;padding:28px 24px;display:grid;gap:14px;text-align:center}
.hero h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em}
.hero p{margin:0;color:var(--fg2)}
.hero .fine{font-size:13px;color:var(--fg3)}
.hero .pill{height:52px;font-size:17px}
/* top */
.top{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(var(--st) + 10px) 12px 0;display:flex;align-items:center;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.top .mid{flex:1;display:flex;justify-content:center;min-width:0}
/* stage */
#frame{position:fixed;left:50%;transform:translateX(-50%);touch-action:none;cursor:grab;border-radius:16px;overflow:hidden;background:#111}
#frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#gh{opacity:.4;pointer-events:none}
#guides{position:absolute;inset:0;pointer-events:none}
.g-box{position:absolute;border:1.5px dashed rgba(255,214,10,.95);border-radius:12px}
.g-box.round{border-radius:50%}
.g-line{position:absolute;height:0;border-top:2px dashed rgba(255,214,10,.95)}
.tag{position:absolute;top:10px;left:10px;height:28px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;font-size:12px;font-weight:600}
.tag.warn{color:var(--warn)}
.fabs{position:absolute;right:10px;top:10px;display:grid;gap:8px}
.banner{position:absolute;left:10px;right:10px;bottom:10px;border-radius:18px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;font-size:13px}
.banner span{flex:1}
.banner.warn span{color:var(--warn)}
.chipb{height:32px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.9);color:#000;font-size:13px;font-weight:600;flex:none}
#grid{position:fixed;left:12px;right:12px;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start;padding-bottom:12px}
.cell{position:relative;border-radius:14px;overflow:hidden;background:#111}
.cell canvas{display:block;width:100%;height:auto}
/* dock */
.dock{position:fixed;left:10px;right:10px;bottom:calc(var(--sb) + 10px);z-index:10;display:grid;gap:8px;max-width:560px;margin:0 auto}
.panel{border-radius:26px;padding:12px 14px}
.panel section{display:grid;gap:10px}
.field{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;font-size:13px;color:var(--fg2)}
.field input{grid-column:1/-1;width:100%;accent-color:#fff;height:28px;margin:0}
.hint{margin:0;font-size:13px;color:var(--fg2)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 13px;border-radius:999px;background:rgba(255,255,255,.12);font-size:13px;font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{background:#fff;color:#000;font-weight:600}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;height:32px;border-radius:999px;font-size:13px;color:var(--fg2);white-space:nowrap}
.seg button[aria-pressed=true]{background:rgba(255,255,255,.92);color:#000;font-weight:600}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:36px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.14);font-size:14px;font-weight:500}
.btn[aria-pressed=true]{background:rgba(255,255,255,.92);color:#000}
.strip{border-radius:24px;padding:8px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.th{position:relative;flex:none;width:52px;height:64px;border-radius:14px;overflow:hidden;background:#222;box-shadow:inset 0 0 0 2px transparent}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.on::after{content:"";position:absolute;inset:0;border-radius:14px;box-shadow:inset 0 0 0 2.5px #fff}
.th.add{display:grid;place-items:center;background:rgba(255,255,255,.1)}
.b-ref{position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.b-ref svg{width:12px;height:12px;fill:var(--warn);stroke:none}
.b-warn{position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--warn);color:#000;font-size:12px;font-weight:800;display:grid;place-items:center}
.b-px{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:var(--warn);font-size:10px;font-weight:700;text-align:center;padding:1px 0}
.tabs{border-radius:999px;padding:4px;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;padding:6px 0;border-radius:999px;color:var(--fg2)}
.tab.on{background:rgba(255,255,255,.2);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 64px);z-index:40;padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100vw - 32px)}
/* sheets */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;flex-direction:column}
.sheet-bar{margin:calc(var(--st) + 10px) 12px 0;border-radius:999px;padding:4px;display:flex;align-items:center;justify-content:space-between}
.sheet-bar strong{font-size:15px}
.ed-wrap{flex:1;min-height:0;display:grid;place-items:center;padding:12px}
#editor{position:relative;touch-action:none}
#edImg{display:block;max-width:calc(100vw - 24px);max-height:calc(100dvh - 230px);border-radius:10px}
#edBox{position:absolute;border:2px solid var(--warn);border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);cursor:move}
#edBox.round{border-radius:50%}
.rz{position:absolute;right:-14px;bottom:-14px;width:28px;height:28px;border-radius:50%;background:var(--warn);border:3px solid #fff;cursor:nwse-resize}
#edLine{position:absolute;inset:0}
#edSvg{position:absolute;left:0;top:0;pointer-events:none}
.h{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--warn);border:3px solid #fff}
.sheet-foot{margin:0 12px calc(var(--sb) + 12px);border-radius:26px;padding:12px 14px;display:grid;gap:10px}
.bs{margin-top:auto;max-height:90dvh;overflow-y:auto;border-radius:30px 30px 0 0;padding:14px 16px calc(var(--sb) + 16px);display:grid;gap:12px;background:rgba(30,30,34,.7)}
.bs-h{display:flex;justify-content:space-between;align-items:center}
.bs-h strong{font-size:18px}
.opts{display:grid;gap:8px}
.opt{display:grid;gap:2px;text-align:left;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1.5px transparent}
.opt span{font-size:13px;color:var(--fg2)}
.opt[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--accent);background:rgba(10,132,255,.14)}
#custom{display:grid;gap:10px}
.outs{display:grid;gap:12px}
.out{display:grid;gap:6px}
.out img{width:100%;border-radius:12px;display:block;-webkit-touch-callout:default;-webkit-user-select:auto}
.out .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--fg2)}
</style>

<div id="empty">
  <div class="hero glass">
    <h1>Even Frames</h1>
    <p>Add the whole set first. You'll pick the photo to match once you can see them all.</p>
    <button class="glass pri pill" id="pick">Choose photos</button>
    <p class="fine">Photos never leave this device.</p>
  </div>
</div>

<div id="app" hidden>
  <div class="top" id="top">
    <button class="glass circ" id="viewBtn" aria-label="Show all photos"></button>
    <div class="mid"><button class="glass pill" id="status"></button></div>
    <button class="glass pri pill" id="exportBtn">Export</button>
  </div>

  <div id="frame">
    <canvas id="pv"></canvas><canvas id="gh"></canvas>
    <div id="guides"></div>
    <span class="glass tag" id="tag" hidden></span>
    <div class="fabs">
      <button class="glass circ sm" id="ghostBtn" data-ic="ghost" aria-label="Overlay the reference" aria-pressed="false"></button>
      <button class="glass circ sm" id="cmpBtn" data-ic="compare" aria-label="Hold to see the original"></button>
    </div>
    <div class="glass banner" id="banner" hidden><span id="bTxt"></span><button class="chipb" id="bAct"></button></div>
  </div>
  <div id="grid" hidden></div>

  <div class="dock" id="dock">
    <div class="glass panel" id="panel">
      <section data-p="frame">
        <div class="chips" id="ratios" role="group" aria-label="Frame ratio"></div>
        <label class="field"><span>Subject size</span><span id="zoomV"></span>
          <input type="range" id="zoom" min="0.6" max="2.5" step="0.01"></label>
        <div class="seg" id="edges" role="group" aria-label="When a photo runs out of edge">
          <button data-v="fill">Fill edges</button><button data-v="tight">Crop tighter</button></div>
      </section>
      <section data-p="pos" hidden>
        <p class="hint">Drag the photo to move the subject. Every photo follows.</p>
        <div class="btnrow"><button class="btn" id="posReset">Match reference</button><button class="btn" id="guidesBtn">Guides</button></div>
      </section>
      <section data-p="color" hidden>
        <label class="field"><span>Match reference color</span><span id="colV"></span>
          <input type="range" id="col" min="0" max="100" step="1"></label>
        <div class="seg" id="protect" role="group" aria-label="Color applies to">
          <button data-v="1">Protect subject</button><button data-v="0">Whole photo</button></div>
      </section>
      <section data-p="subj" hidden>
        <div class="seg" id="kinds" role="group" aria-label="Match by"><button data-v="face"></button><button data-v="body"></button><button data-v="object"></button></div>
        <p class="hint" id="subjInfo"></p>
        <div class="btnrow"><button class="btn" id="editBtn">Edit subject</button><button class="btn" id="refBtn">Make reference</button><button class="btn" id="rmBtn">Remove</button></div>
      </section>
    </div>
    <div class="glass strip" id="strip"></div>
    <div class="glass tabs" id="tabs">
      <button class="tab" data-t="frame" data-ic="frame">Frame</button>
      <button class="tab" data-t="pos" data-ic="move">Position</button>
      <button class="tab" data-t="color" data-ic="color">Color</button>
      <button class="tab" data-t="subj" data-ic="subject">Subject</button>
    </div>
  </div>
</div>

<div class="glass toast" id="toast" hidden></div>
<input type="file" id="file" accept="image/*" multiple hidden>

<div class="sheet" id="sheet" hidden>
  <div class="glass sheet-bar"><button class="pill" id="edCancel">Cancel</button><strong id="edT">Subject</strong><button class="glass pri pill" id="edDone">Done</button></div>
  <div class="ed-wrap"><div id="editor">
    <img id="edImg" alt="">
    <div id="edBox"><div class="rz"></div></div>
    <div id="edLine"><svg id="edSvg"><line id="edL" stroke="#ffd60a" stroke-width="3" stroke-dasharray="6 5"/></svg><div class="h" data-i="0"></div><div class="h" data-i="1"></div></div>
  </div></div>
  <div class="glass sheet-foot"><p class="hint" id="edHint"></p><div class="btnrow"><button class="btn" id="edReset">Reset to auto</button></div></div>
</div>

<div class="sheet" id="exp" hidden>
  <div class="bs glass">
    <div class="bs-h"><strong>Export</strong><button class="glass circ sm" id="expClose" aria-label="Close">✕</button></div>
    <div class="opts" id="presets"></div>
    <div id="custom" hidden>
      <div class="seg" id="fmt"><button data-v="image/jpeg">JPEG</button><button data-v="image/png">PNG</button><button data-v="image/webp" id="webpBtn">WebP</button></div>
      <label class="field" id="qRow"><span>Quality</span><span id="qV"></span><input type="range" id="q" min="80" max="100" step="1"></label>
      <div class="chips" id="widths"></div>
    </div>
    <p class="hint" id="expNote"></p>
    <button class="glass pri pill wide" id="expGo">Export</button>
    <div class="outs" id="outs"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module">
/* ---------- basics */
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const tick = () => new Promise((r) => setTimeout(r, 30));
const SMALL = 640, HI = 1280, MID = 1600, PREV = 1200, MAX_AREA = 16_000_000;
const KN = { face: "Face", body: "Body", object: "Object" };
const MODEL = {
  pose: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
  object: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite",
  touch: "https://storage.googleapis.com/mediapipe-models/interactive_segmenter/magic_touch/float32/1/magic_touch.tflite",
};
const P3 = (() => { try { const x = mk(1, 1).getContext("2d", { colorSpace: "display-p3" }); return x?.getContextAttributes?.().colorSpace === "display-p3"; } catch { return false; } })();
const ctx = (c, read) => c.getContext("2d", Object.assign(P3 ? { colorSpace: "display-p3" } : {}, read ? { willReadFrequently: true } : {}));
if ((navigator.deviceMemory || 8) <= 4 || (navigator.hardwareConcurrency || 8) <= 4) document.documentElement.classList.add("lite");

const S = { photos: [], ref: 0, cur: 0, kind: "face", kindLocked: false, aspect: "4:5", zoom: 1, edges: "fill", pos: null,
  color: 70, protect: true, guides: true, ghost: false, comparing: false, fast: false, view: "one", tab: "frame",
  preset: "ig", fmt: "image/jpeg", q: 92, width: "full", lay: null, params: [], busyText: "", nextId: 1 };

const IC = {
  frame: '<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="10" r="2.5"/><path d="M8 17c.8-2 2.2-3 4-3s3.2 1 4 3"/>',
  move: '<path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/>',
  color: '<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/>',
  subject: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 3.8-5.5 7-5.5s5.8 1.9 7 5.5"/>',
  grid: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  single: '<rect x="5" y="3" width="14" height="18" rx="2.5"/>',
  compare: '<circle cx="12" cy="12" r="8"/><path d="M12 4v16"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>',
  ghost: '<rect x="3" y="7" width="11" height="14" rx="2"/><rect x="10" y="3" width="11" height="14" rx="2" stroke-dasharray="2.5 2.5"/>',
  star: '<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
};
const ic = (n) => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2600); }

/* ---------- detection engine: face + person mask from local files, the rest on demand */
let V = null, FS = null; const E = {};
const engineReady = (async () => {
  try {
    const base = new URL("mp/", location.href).href;
    V = await import(base + "vision_bundle.mjs");
    const models = await (await fetch(base + "models.json")).json();
    const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    FS = { wasmLoaderPath: base + "vision_wasm_internal.js", wasmBinaryPath: base + "vision_wasm_internal.wasm" };
    E.face = await V.FaceDetector.createFromOptions(FS, { baseOptions: { modelAssetBuffer: b64(models.face), delegate: "CPU" }, runningMode: "IMAGE", minDetectionConfidence: 0.4 });
    try {
      E.seg = await V.ImageSegmenter.createFromOptions(FS, { baseOptions: { modelAssetBuffer: b64(models.seg), delegate: "CPU" }, runningMode: "IMAGE", outputConfidenceMasks: true, outputCategoryMask: false });
    } catch (e) { console.warn("segmenter", e); }
    return true;
  } catch (e) { console.warn("engine", e); toast("Auto-detect isn't available here. Set subjects by hand."); return false; }
})();
const lazy = {};
function task(name) {
  if (lazy[name]) return lazy[name];
  lazy[name] = (async () => {
    if (!(await engineReady)) return null;
    try {
      if (name === "pose") return await V.PoseLandmarker.createFromOptions(FS, { baseOptions: { modelAssetPath: MODEL.pose, delegate: "CPU" }, runningMode: "IMAGE", numPoses: 1 });
      if (name === "object") return await V.ObjectDetector.createFromOptions(FS, { baseOptions: { modelAssetPath: MODEL.object, delegate: "CPU" }, runningMode: "IMAGE", scoreThreshold: 0.35, maxResults: 5 });
      if (name === "touch") return await V.InteractiveSegmenter.createFromOptions(FS, { baseOptions: { modelAssetPath: MODEL.touch, delegate: "CPU" }, outputCategoryMask: false, outputConfidenceMasks: true });
    } catch (e) { console.warn(name, e); return null; }
  })();
  return lazy[name];
}
function detFace(c, s) {
  if (!E.face) return null;
  const r = E.face.detect(c);
  if (!r.detections?.length) return null;
  const b = r.detections.reduce((a, d) => (d.boundingBox.width * d.boundingBox.height > a.boundingBox.width * a.boundingBox.height ? d : a)).boundingBox;
  return { cx: (b.originX + b.width / 2) / s, cy: (b.originY + b.height / 2) / s, size: b.height / s, w: b.width / s };
}
async function detBody(p) {
  const t = await task("pose"); if (!t) return null;
  const lm = t.detect(p.small.c).landmarks?.[0]; if (!lm) return null;
  const hasVis = lm.some((l) => l.visibility > 0), vis = (k) => (hasVis ? lm[k].visibility : 1);
  if (vis(11) < 0.2 || vis(12) < 0.2) return null;
  const a = [lm[11].x * p.W, lm[11].y * p.H], b = [lm[12].x * p.W, lm[12].y * p.H];
  const size = Math.hypot(a[0] - b[0], a[1] - b[1]);
  if (size < 8) return null;
  return { cx: (a[0] + b[0]) / 2, cy: (a[1] + b[1]) / 2, size, w: size, pts: [a, b] };
}
async function detObject(p) {
  const t = await task("object"); if (!t) return null;
  const ds = t.detect(p.small.c).detections; if (!ds?.length) return null;
  const sc = (d) => d.boundingBox.width * d.boundingBox.height * (d.categories[0]?.score || 0);
  const b = ds.reduce((a, d) => (sc(d) > sc(a) ? d : a)).boundingBox, s = p.small.s;
  return { cx: (b.originX + b.width / 2) / s, cy: (b.originY + b.height / 2) / s, size: b.height / s, w: b.width / s };
}

  $("ratios").querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", c.dataset.v === S.aspect));
  $("zoom").value = S.zoom; $("zoomV").textContent = S.zoom.toFixed(2) + "×";
  setSeg("edges", S.edges); setSeg("protect", S.protect ? "1" : "0"); setSeg("kinds", S.kind);
  $("col").value = S.color; $("colV").textContent = S.color + "%";
  $("posReset").setAttribute("aria-pressed", !S.pos); $("guidesBtn").setAttribute("aria-pressed", S.guides);
  const P = S.photos;
  ["face", "body", "object"].forEach((k) => {
    const n = P.filter((p) => anchorOf(p, k)).length, tried = P.every((p) => p.tried[k]);
    $("kinds").querySelector(`[data-v=${k}]`).textContent = KN[k] + (tried ? ` ${n}/${P.length}` : "");
  });
  const p = P[S.cur], kn = KN[S.kind].toLowerCase();
  $("subjInfo").textContent = `Photo ${S.cur + 1}${S.cur === S.ref ? " (reference)" : ""}: ` +
    (p.manual[S.kind] ? `${kn} set by hand.` : anchorOf(p) ? `${kn} found automatically.` : `no ${kn} found. Tap Edit subject.`);
  $("refBtn").hidden = S.cur === S.ref; $("rmBtn").hidden = P.length < 2;
}

/* ---------- subject editor */
let ED = null;
function openEditor(i) {
  const p = S.photos[i], k = S.kind, an = anchorOf(p, k) || guess(p, k);
  ED = { p, k, cx: an.cx, cy: an.cy, size: an.size, w: an.w || an.size, pts: (an.pts || guess(p, "body").pts).map((q) => [...q]) };
  $("sheet").hidden = false; $("edT").textContent = `${KN[k]} · photo ${i + 1}`;
  $("edHint").textContent = k === "face" ? "Drag the box over the face, forehead to chin. Drag the dot to resize."
    : k === "body" ? "Drag the two dots onto the shoulders." : "Tap the subject to select it, or drag the box around it.";
  $("edBox").hidden = k === "body"; $("edLine").hidden = k !== "body"; $("edBox").classList.toggle("round", k === "face");
  const img = $("edImg"); img.onload = placeEd; img.src = p.url; if (img.complete) placeEd();
}
function placeEd() {
  const img = $("edImg"), k = img.clientWidth / ED.p.W;
  if (ED.k === "body") {
    const svg = $("edSvg"), [a, b] = ED.pts, L = $("edL");
    svg.setAttribute("width", img.clientWidth); svg.setAttribute("height", img.clientHeight);
    L.setAttribute("x1", a[0] * k); L.setAttribute("y1", a[1] * k); L.setAttribute("x2", b[0] * k); L.setAttribute("y2", b[1] * k);
    document.querySelectorAll("#edLine .h").forEach((h, i) => { h.style.left = ED.pts[i][0] * k + "px"; h.style.top = ED.pts[i][1] * k + "px"; });
  } else {
    const b = $("edBox"), bw = (ED.k === "object" ? ED.w : ED.size) * k, bh = ED.size * k;
    Object.assign(b.style, { width: bw + "px", height: bh + "px", left: ED.cx * k - bw / 2 + "px", top: ED.cy * k - bh / 2 + "px" });
  }
}
async function tapSelect(nx, ny) {
  const t = await task("touch"); if (!t) { toast("Tap to select isn't available here. Drag the box instead."); return; }
  const p = ED.p, c = p.small.c; $("edHint").textContent = "Selecting…";

    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (f[y * w + x] > 0.5) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 < 0) return;
    const s = p.small.s; ED.cx = (x0 + x1 + 1) / 2 / s; ED.cy = (y0 + y1 + 1) / 2 / s; ED.size = (y1 - y0 + 1) / s; ED.w = (x1 - x0 + 1) / s;
  });

}
(() => {
  const ed = $("editor"); let m = null;
  ed.addEventListener("pointerdown", async (e) => {
    const t = e.target;
    if (t.classList.contains("rz")) m = { t: "size" };
    else if (t.id === "edBox") m = { t: "move" };
    else if (t.classList.contains("h")) m = { t: "pt", i: +t.dataset.i };
    else if (ED.k === "object") { const r = $("edImg").getBoundingClientRect(); await tapSelect((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height); return; }
    else return;
    e.preventDefault(); Object.assign(m, { x: e.clientX, y: e.clientY, s: { cx: ED.cx, cy: ED.cy, size: ED.size, w: ED.w, pts: ED.pts.map((q) => [...q]) } });
    ed.setPointerCapture(e.pointerId);
  });
  ed.addEventListener("pointermove", (e) => {
    if (!m) return;
    const k = $("edImg").clientWidth / ED.p.W, dx = (e.clientX - m.x) / k, dy = (e.clientY - m.y) / k, P = ED.p, big = Math.max(P.W, P.H);
    if (m.t === "move") { ED.cx = clamp(m.s.cx + dx, 0, P.W); ED.cy = clamp(m.s.cy + dy, 0, P.H); }
    else if (m.t === "size") {
      if (ED.k === "object") { ED.size = clamp(m.s.size + dy * 2, 12, big); ED.w = clamp(m.s.w + dx * 2, 12, big); }
      else { ED.size = ED.w = clamp(m.s.size + Math.max(dx, dy) * 2, 12, Math.min(P.W, P.H)); }
    } else ED.pts[m.i] = [clamp(m.s.pts[m.i][0] + dx, 0, P.W), clamp(m.s.pts[m.i][1] + dy, 0, P.H)];
    placeEd();
  });
  const up = () => { m = null; }; ed.addEventListener("pointerup", up); ed.addEventListener("pointercancel", up);
})();
$("edDone").onclick = () => {
  const p = ED.p;
  if (ED.k === "body") { const [a, b] = ED.pts, d = Math.hypot(a[0] - b[0], a[1] - b[1]); p.manual.body = { cx: (a[0] + b[0]) / 2, cy: (a[1] + b[1]) / 2, size: d, w: d, pts: ED.pts }; }
  else p.manual[ED.k] = { cx: ED.cx, cy: ED.cy, size: ED.size, w: ED.w };
  $("sheet").hidden = true; schedule();
};
$("edCancel").onclick = () => { $("sheet").hidden = true; };
$("edReset").onclick = () => {
  delete ED.p.manual[ED.k];
  const an = ED.p.det[ED.k] || guess(ED.p, ED.k);
  Object.assign(ED, { cx: an.cx, cy: an.cy, size: an.size, w: an.w || an.size, pts: (an.pts || guess(ED.p, "body").pts).map((q) => [...q]) });
  placeEd();
};

/* ---------- export */
const PRESETS = [["ig", "Instagram"], ["uniform", "Same size, sharpest"], ["full", "Full resolution"], ["custom", "Custom"]];
function outSize(crop, lay) {
  const minW = Math.min(...lay.crops.map((c) => c.w));
  let w = S.preset === "ig" ? 1080 : S.preset === "uniform" ? minW : S.preset === "custom" && S.width !== "full" ? +S.width : crop.w, h = w / lay.a;
  if (w * h > MAX_AREA) { const k = Math.sqrt(MAX_AREA / (w * h)); w *= k; h *= k; }
  return [Math.max(1, Math.round(w)), Math.max(1, Math.round(h))];
}
function renderExp() {
  const lay = (S.lay = layout()), ws = lay.crops.map((c) => c.w), mn = Math.round(Math.min(...ws)), mx = Math.round(Math.max(...ws));
  const up = ws.filter((w) => w < 1080).length;
  const desc = {
    ig: `1080 px wide, JPEG.${up ? ` ${up} photo${up > 1 ? "s" : ""} will be upscaled.` : ""}`,
    uniform: `${mn} px wide, JPEG. Nothing is upscaled.`,
    full: `${mn === mx ? mn : mn + "–" + mx} px wide, JPEG. Every pixel is kept.`,
    custom: "Pick format, quality and width.",
  };
  const box = $("presets"); box.innerHTML = "";
  PRESETS.forEach(([v, t]) => {
    const b = document.createElement("button"); b.className = "opt"; b.setAttribute("aria-pressed", S.preset === v);
    b.innerHTML = "<strong></strong><span></span>"; b.firstChild.textContent = t; b.lastChild.textContent = desc[v];
    b.onclick = () => { S.preset = v; renderExp(); }; box.appendChild(b);
  });
  $("custom").hidden = S.preset !== "custom"; setSeg("fmt", S.fmt);
  $("q").value = S.q; $("qV").textContent = S.q; $("qRow").hidden = S.fmt === "image/png";
  $("widths").querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", c.dataset.v === S.width));
  $("expNote").textContent = `Location and camera data are removed.${P3 ? " Colors stay in Display P3." : ""}`;
  $("expGo").textContent = `Export ${S.photos.length} photos`; $("expGo").disabled = false;
}
let outputs = [];
async function doExport() {
  const go = $("expGo"); go.disabled = true;
  outputs.forEach((o) => URL.revokeObjectURL(o.url)); outputs = []; $("outs").innerHTML = "";
  const lay = layout(), params = colorParams(lay), fmt = S.preset === "custom" ? S.fmt : "image/jpeg", q = (S.preset === "custom" ? S.q : 92) / 100;
  const ext = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp" }[fmt];
  for (let i = 0; i < S.photos.length; i++) {
    go.textContent = `Exporting ${i + 1} of ${S.photos.length}…`; await tick();
    const p = S.photos[i], crop = lay.crops[i], [w, h] = outSize(crop, lay), img = await loadImg(p.url), out = mk(w, h), x = ctx(out, true);
    paint(x, p, img, 1, crop, w, h, true); img.src = "";
    if (params[i]) { const id = x.getImageData(0, 0, w, h); applyColor(id, params[i], S.color / 100, p, crop, w, h); x.putImageData(id, 0, 0); }
    const blob = await new Promise((r) => out.toBlob(r, fmt, fmt === "image/png" ? undefined : q)); out.width = 0;
    outputs.push({ name: `${String(i + 1).padStart(2, "0")}_${p.name}.${ext}`, blob, url: URL.createObjectURL(blob), w, h });
  }
  go.textContent = "Export again"; go.disabled = false; showOutputs();
}
async function saveFile(name, blob, btn) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file] }); if (btn) btn.textContent = "Saved"; return; } catch (e) { if (e?.name === "AbortError") return; } }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}
function showOutputs() {
  const box = $("outs"); box.innerHTML = "";
  const files = outputs.map((o) => new File([o.blob], o.name, { type: o.blob.type })), canAll = navigator.canShare?.({ files });
  const all = document.createElement("button"); all.className = "glass pill wide"; all.textContent = canAll ? "Save all to Photos" : "Save all (.zip)";
  all.onclick = async () => {
    if (canAll) { try { await navigator.share({ files }); } catch {} return; }
    if (!window.JSZip) { all.textContent = "Zip unavailable"; return; }
    all.textContent = "Zipping…"; const z = new JSZip(); outputs.forEach((o) => z.file(o.name, o.blob));
    await saveFile("even-frames.zip", await z.generateAsync({ type: "blob", compression: "STORE" })); all.textContent = "Save all (.zip)";
  };
  box.appendChild(all);
  outputs.forEach((o) => {
    const d = document.createElement("div"); d.className = "out";
    d.innerHTML = `<img alt=""><div class="row"><span></span><button class="btn">Save</button></div>`;
    d.querySelector("img").src = o.url; d.querySelector("img").alt = o.name;
    d.querySelector("span").textContent = `${o.name} · ${o.w}×${o.h}px · ${(o.blob.size / 1e6).toFixed(1)} MB`;
    const b = d.querySelector("button"); b.onclick = () => saveFile(o.name, o.blob, b); box.appendChild(d);
  });
  all.scrollIntoView({ block: "start", behavior: "smooth" });
}

/* ---------- wiring */
document.querySelectorAll("[data-ic]").forEach((el) => el.insertAdjacentHTML("afterbegin", ic(el.dataset.ic)));
[["orig", "Original"], ["4:5", "4:5"], ["1:1", "1:1"], ["3:4", "3:4"], ["2:3", "2:3"], ["9:16", "9:16"], ["3:2", "3:2"], ["16:9", "16:9"]].forEach(([v, l]) => {
  const b = document.createElement("button"); b.className = "chip"; b.dataset.v = v; b.textContent = l;
  b.onclick = () => { S.aspect = v; schedule(); }; $("ratios").appendChild(b);
});
[["full", "Full"], ["2160", "2160"], ["1440", "1440"], ["1080", "1080"]].forEach(([v, l]) => {
  const b = document.createElement("button"); b.className = "chip"; b.dataset.v = v; b.textContent = l;
  b.onclick = () => { S.width = v; renderExp(); }; $("widths").appendChild(b);
});
const bindSeg = (id, fn) => $(id).querySelectorAll("button").forEach((b) => (b.onclick = () => fn(b.dataset.v)));
bindSeg("edges", (v) => { S.edges = v; schedule(); });
bindSeg("protect", (v) => { S.protect = v === "1"; schedule(); });
bindSeg("fmt", (v) => { S.fmt = v; renderExp(); });
bindSeg("kinds", async (v) => { S.kindLocked = true; await ensureKind(v); S.kind = v; S.busyText = ""; schedule(); });
const slide = (id, fn) => { $(id).oninput = (e) => { fn(+e.target.value); S.fast = true; schedule(); }; $(id).onchange = () => { S.fast = false; schedule(); }; };
slide("zoom", (v) => (S.zoom = v));
slide("col", (v) => (S.color = v));
$("q").oninput = (e) => { S.q = +e.target.value; $("qV").textContent = S.q; };
document.querySelectorAll("#tabs .tab").forEach((t) => (t.onclick = () => { S.tab = t.dataset.t; schedule(); }));
$("posReset").onclick = () => { S.pos = null; schedule(); };
$("guidesBtn").onclick = () => { S.guides = !S.guides; schedule(); };
$("ghostBtn").onclick = () => { S.ghost = !S.ghost; schedule(); };
$("editBtn").onclick = () => openEditor(S.cur);
$("refBtn").onclick = () => { S.ref = S.cur; S.pos = null; toast("Reference set. Every photo now matches this one."); schedule(); };
$("rmBtn").onclick = () => {
  const i = S.cur, p = S.photos[i]; URL.revokeObjectURL(p.url); p.el?.remove(); S.photos.splice(i, 1);
  if (i === S.ref) S.ref = 0; else if (i < S.ref) S.ref--; schedule();
};
$("viewBtn").onclick = () => { S.view = S.view === "grid" ? "one" : "grid"; schedule(); };
$("exportBtn").onclick = () => { renderExp(); $("outs").innerHTML = ""; $("exp").hidden = false; };
$("expClose").onclick = () => { $("exp").hidden = true; };
$("expGo").onclick = doExport;
$("pick").onclick = () => $("file").click();
$("file").onchange = (e) => { const f = [...e.target.files]; e.target.value = ""; addFiles(f); };
(() => { const c = mk(2, 2); if (!c.toDataURL("image/webp").startsWith("data:image/webp")) $("webpBtn").hidden = true; })();
(() => {
  const b = $("cmpBtn"), on = (e) => { e.preventDefault(); S.comparing = true; schedule(); }, off = () => { if (S.comparing) { S.comparing = false; schedule(); } };
  b.addEventListener("pointerdown", on); ["pointerup", "pointercancel", "pointerleave"].forEach((t) => b.addEventListener(t, off));
})();
(() => {
  const f = $("frame"); let st = null;
  f.addEventListener("pointerdown", (e) => { if (e.target.closest("button")) return; st = { x: e.clientX, y: e.clientY, tx: S.lay.tx, ty: S.lay.ty }; f.setPointerCapture(e.pointerId); });
  f.addEventListener("pointermove", (e) => {
    if (!st) return; const r = f.getBoundingClientRect();
    S.pos = [clamp(st.tx + (e.clientX - st.x) / r.width, 0.05, 0.95), clamp(st.ty + (e.clientY - st.y) / r.height, 0.05, 0.95)];
    S.fast = true; schedule();
  });
  const end = () => { if (st) { st = null; S.fast = false; schedule(); } };
  f.addEventListener("pointerup", end); f.addEventListener("pointercancel", end);
})();
addEventListener("resize", schedule);
render();
</script>
